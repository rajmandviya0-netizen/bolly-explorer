<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BollyExplorer: browse Bollywood movies from 2025 and 2026, search, filter and save a watchlist." />
    <title>BollyExplorer</title>

    <!-- 🎬 emoji as the tab icon (no image file needed) -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>"
    />

    <!-- apply the saved theme BEFORE the page paints (no white flash) -->
    <script>
      try {
        var t =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
